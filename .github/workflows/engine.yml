# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-QUANT
#  >>> FILE PATH:   .github/workflows/engine.yml
#  The intraday engine, 0920 ET to the close. A job may run 6 h, so the engine stops after 345 minutes and
#  quant/engine_job.sh queues the next job while the session is open - and, z169, Monday-Thursday nights too (the
#  next job waits for 0920 ET), so the week no longer depends on GitHub starting the 0920 schedule. Open positions
#  are handed over in data/quant/open.json; data/quant is committed every 15 minutes while it trades. Started by GitHub's schedule (twin crons, ET-gated)
#  and by the Supabase heartbeat; a start while one is running queues behind it.
#  Secrets: ALPACA_KEY_ID / ALPACA_SECRET_KEY (the paper account - market data AND paper orders), SUPABASE_URL /
#  SUPABASE_SERVICE_ROLE (the PORT+ANALYTICS project - where quant_trades / quant_state live; z166), FINNHUB_KEY (optional).
#  Variables: QUANT_FEED ("sip" once you subscribe to Alpaca Algo Trader Plus, else "iex"), QUANT_STREAM_LIMIT.
# ============================================================
name: Quant engine (intraday book)

on:
  schedule:
    - cron: '20 13 * * 1-5'    # 0920 EDT
    - cron: '20 14 * * 1-5'    # 0920 EST
  workflow_dispatch:

concurrency:
  group: quant-engine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"; OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          if [ "${ETH}:${ETM}" = "9:20" ]; then RUN=true; else RUN=false; fi
          echo "schedule '$S' = ${ETH}:${ETM} ET -> run=${RUN}"; echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  engine:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Engine - commits as it trades, then queues the next job (z169)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          QUANT_FEED: ${{ vars.QUANT_FEED || 'iex' }}
          QUANT_STREAM_LIMIT: ${{ vars.QUANT_STREAM_LIMIT || '30' }}
          QUANT_BUDGET_MIN: '345'
          GH_TOKEN: ${{ github.token }}
        run: bash quant/engine_job.sh
